<app-edge-panel edge="left" width="20rem" storageKey="agenda-drop-zone"
    [visible]="!!draggedAgendaItem()" [dragPosition]="dragPosition()">
    @for (agenda of agendas(); track agenda.id) {
        @let active = agenda.id === lastDrag()?.data?.agenda;
        <div #agendaCard class="card canvas-card selectable-card selectable-outlined-card"
            [class.disabled]="active"
            [class.hover]="hoveredAgenda() === agenda">
            @if (active) {
                <div class="indicator accent-fg"></div>
            }
            <app-agenda-list-row [row]="agenda"/>
        </div>
    }
</app-edge-panel>
